# Build the game on GitHub runners: install the project's exact Unity
# editor, activate the Personal license from the account secrets, compile,
# run EditMode tests, and (when a signing password secret exists) produce
# the production-debug Android APK.
#
# Why Hub and not a GameCI Docker image: the project pins an alpha editor
# (7000.0.0a8, changeset c93e369fcf1c) that public unityci/editor images do
# not carry, so the editor is installed with Unity Hub by version+changeset,
# exactly like on a developer machine.
#
# Secrets used (Settings -> Secrets and variables -> Actions):
#   UNITY_EMAIL / UNITY_PASSWORD  Unity ID for Personal activation
#   ANDROID_SIGNING_PASSWORD      optional; one invented password. When set,
#                                 the Android job generates a release
#                                 keystore with it (kept in the Actions
#                                 cache) and signs the production-debug APK.
# Without ANDROID_SIGNING_PASSWORD the Android job finishes green after
# printing what is missing; no debug-certificate APK is ever produced.

name: Unity build

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/f9c604c3-golub"
    paths:
      - ".github/workflows/unity-build.yml"

permissions:
  contents: read

env:
  UNITY_VERSION: "7000.0.0a8"
  UNITY_CHANGESET: "c93e369fcf1c"

jobs:
  verify:
    name: Compile and EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install the Unity CLI and the exact editor
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Logs
          curl -sL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor -o /usr/share/keyrings/Unity_Technologies_ApS.gpg
          echo "Types: deb" | sudo tee /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "URIs: https://hub.unity3d.com/linux/repos/deb" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Suites: unstable" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Components: main" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          sudo apt-get update -qq 2>&1 | tee Logs/unity-cli-install.log
          sudo apt-get install -y unity-cli 2>&1 | tee -a Logs/unity-cli-install.log
          unity --version 2>&1 | tee -a Logs/unity-cli-install.log
          set +e
          unity install "$UNITY_VERSION" -c "$UNITY_CHANGESET" \
            > Logs/unity-editor-install.log 2>&1
          code=$?
          set -e
          tail -n 60 Logs/unity-editor-install.log || true
          if [ "$code" -ne 0 ]; then
            tail -n 25 Logs/unity-editor-install.log | while IFS= read -r line; do
              echo "::error::editor-install: $line"
            done
            exit "$code"
          fi
          find "$HOME" -maxdepth 7 -type f -name Unity 2>/dev/null | head -5 || true
          EDITOR="$(find "$HOME" -maxdepth 7 -type f -path "*/$UNITY_VERSION/*/Unity" 2>/dev/null | head -1)"
          if [ -z "$EDITOR" ]; then
            EDITOR="$(find "$HOME" -maxdepth 7 -type f -name Unity 2>/dev/null | head -1)"
          fi
          echo "::error::located editor: ${EDITOR:-<none>}"
          test -x "$EDITOR"
          echo "UNITY_EDITOR=$EDITOR" >> "$GITHUB_ENV"

      - name: Publish install diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Editor install failed in run $GITHUB_RUN_ID."
            echo
            echo "## unity-editor-install.log (tail)"
            echo '```'
            tail -n 120 Logs/unity-editor-install.log 2>/dev/null || echo "<missing>"
            echo '```'
            echo "## unity-cli-install.log (tail)"
            echo '```'
            tail -n 40 Logs/unity-cli-install.log 2>/dev/null || echo "<missing>"
            echo '```'
            echo "## editor binaries found"
            echo '```'
            find "$HOME" -maxdepth 8 -type f -name Unity 2>/dev/null | head -10
            df -h / | tail -1
            echo '```'
          } > /tmp/ci-diagnostics.md
          gh issue create --title "[ci] editor install diagnostics $GITHUB_RUN_ID" \
            --body-file /tmp/ci-diagnostics.md || true

      - name: Activate the Personal license
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          test -x "$CLIENT"
          "$CLIENT" --activate-all --include-personal \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"

      - name: Prepare environment and Sentry SDK
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 Tools/bootstrap_sentry_sdk.py

      - name: Import the project
        shell: bash
        run: UNITY="$UNITY_EDITOR" Tools/unity.sh import

      - name: Compile
        shell: bash
        run: UNITY="$UNITY_EDITOR" Tools/unity.sh compile

      - name: EditMode tests (tier XI and roster)
        shell: bash
        env:
          BLITZ_TEST_FILTER: "TierElevenTests|ModCardDrumNationTests|TankTreeTests|Blitz480DataTests|SmallTankIconTests|TankNameLocalizationTests"
        run: UNITY="$UNITY_EDITOR" Tools/unity.sh test

      - name: Publish test diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PYEOF' > /tmp/ci-test-diagnostics.md
          import glob, xml.etree.ElementTree as ET
          print("EditMode failures in this run:")
          files = glob.glob("Logs/editmode-results.xml")
          if not files:
              print("<no editmode-results.xml produced>")
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:
                  print("parse error:", e); continue
              total = root.get("total"); failed = root.get("failed")
              print(f"total={total} failed={failed}")
              for case in root.iter("test-case"):
                  if case.get("result") == "Failed":
                      print()
                      print("FAILED:", case.get("fullname"))
                      for msg in case.iter("message"):
                          print((msg.text or "")[:1500])
          PYEOF
          head -c 60000 /tmp/ci-test-diagnostics.md > /tmp/ci-test-diagnostics-short.md
          gh issue create --title "[ci] EditMode test diagnostics $GITHUB_RUN_ID" \
            --body-file /tmp/ci-test-diagnostics-short.md || true

      - name: Return the Personal license
        if: always()
        shell: bash
        run: |
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --return-ulf || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-verify-logs
          path: Logs
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android APK (production-debug)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "${ANDROID_SIGNING_PASSWORD}" ]; then
            echo "::warning::ANDROID_SIGNING_PASSWORD secret is not set; skipping the APK build."
            echo "Add one invented password as the ANDROID_SIGNING_PASSWORD secret and re-run." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore or create the release keystore
        if: steps.signing.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blitz-release.p12
          key: blitz-android-release-keystore-v1

      - name: Generate the keystore on first use
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/blitz-release.p12"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias blitzlegacy -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$ANDROID_SIGNING_PASSWORD" \
              -keypass "$ANDROID_SIGNING_PASSWORD" \
              -dname "CN=Blitz Legacy, O=Blitz Legacy, C=NL"
          fi
          ls -l "$KEYSTORE"

      - name: Install the Unity CLI, the exact editor and Android modules
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Logs
          curl -sL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor -o /usr/share/keyrings/Unity_Technologies_ApS.gpg
          echo "Types: deb" | sudo tee /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "URIs: https://hub.unity3d.com/linux/repos/deb" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Suites: unstable" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Components: main" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          echo "Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg" | sudo tee -a /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          sudo apt-get update -qq 2>&1 | tee Logs/unity-cli-install.log
          sudo apt-get install -y unity-cli 2>&1 | tee -a Logs/unity-cli-install.log
          set +e
          unity install "$UNITY_VERSION" -c "$UNITY_CHANGESET" \
            -m android --cm > Logs/unity-editor-install.log 2>&1
          code=$?
          set -e
          tail -n 60 Logs/unity-editor-install.log || true
          if [ "$code" -ne 0 ]; then
            tail -n 25 Logs/unity-editor-install.log | while IFS= read -r line; do
              echo "::error::editor-install: $line"
            done
            exit "$code"
          fi
          find "$HOME" -maxdepth 7 -type f -name Unity 2>/dev/null | head -5 || true
          EDITOR="$(find "$HOME" -maxdepth 7 -type f -path "*/$UNITY_VERSION/*/Unity" 2>/dev/null | head -1)"
          if [ -z "$EDITOR" ]; then
            EDITOR="$(find "$HOME" -maxdepth 7 -type f -name Unity 2>/dev/null | head -1)"
          fi
          echo "::error::located editor: ${EDITOR:-<none>}"
          test -x "$EDITOR"
          echo "UNITY_EDITOR=$EDITOR" >> "$GITHUB_ENV"

      - name: Activate the Personal license
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --activate-all --include-personal \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"

      - name: Build the production-debug APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          cp .env.example .env
          python3 Tools/bootstrap_sentry_sdk.py
          export BLITZ_ANDROID_KEYSTORE="${RUNNER_TEMP}/blitz-release.p12"
          export BLITZ_ANDROID_KEYSTORE_PASSWORD="$ANDROID_SIGNING_PASSWORD"
          export BLITZ_ANDROID_KEY_ALIAS="blitzlegacy"
          export BLITZ_ANDROID_KEY_PASSWORD="$ANDROID_SIGNING_PASSWORD"
          UNITY="$UNITY_EDITOR" Tools/unity.sh apk-production-debug
          ls -l Build/Android/

      - name: Upload the APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BlitzLegacy-productiondebug-apk
          path: Build/Android/BlitzLegacy-productiondebug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Return the Personal license
        if: always() && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --return-ulf || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-android-logs
          path: Logs
          if-no-files-found: ignore
          retention-days: 7
