name: Собрать APK «Голубь»

# Сборка запускается вручную: Actions → «Собрать APK «Голубь»» → Run workflow.
# Готовый файл — внизу запуска: Artifacts → golub-apk.
on:
  workflow_dispatch:

# Две сборки APK одновременно не нужны: вторая отменяет первую.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Прогнать тесты
        working-directory: golub
        run: python -m unittest discover -s tests -v

  apk:
    name: APK (debug, arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 90
    env:
      # Gradle на раннере GitHub: ограничиваем память и отключаем демон,
      # чтобы сборка двух архитектур не упала по OOM и не висела между шагами.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
        -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
      # buildozer/android sdkmanager ругается на нестандартную локаль
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            build-essential \
            python3-pip python3-venv \
            openjdk-17-jdk \
            autoconf automake libtool \
            libffi-dev libssl-dev \
            pkg-config \
            cmake \
            libltdl-dev \
            libsqlite3-dev sqlite3 \
            zlib1g-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "cython<3.1" virtualenv
          buildozer version

      # Кэш ~/.buildozer/global — это Android SDK, NDK, Gradle и рецепты
      # python-for-android. Первый запуск скачивает их заново (~25–40 минут),
      # повторные с тем же buildozer.spec идут заметно быстрее.
      - name: Кэш Android SDK / NDK / Gradle
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/global
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('golub/client/buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Собрать APK
        working-directory: golub/client
        run: buildozer -v android debug

      - name: Показать, что собралось
        working-directory: golub/client
        run: |
          ls -lh bin/
          sha256sum bin/*.apk | tee bin/SHA256SUMS.txt

      - name: Артефакт golub-apk
        uses: actions/upload-artifact@v4
        with:
          name: golub-apk
          path: |
            golub/client/bin/*.apk
            golub/client/bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
