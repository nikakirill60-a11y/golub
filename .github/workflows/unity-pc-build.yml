# Build the desktop (PC) player on a GitHub runner.
#
# The Linux x86_64 production-debug player is the desktop build this
# project's Linux editor can produce (Windows IL2CPP requires a Windows
# editor and is attempted separately). The editor is the project's exact
# alpha (7000.0.0a8 / c93e369fcf1c), installed with the Unity CLI; the
# Personal license is activated from the UNITY_EMAIL / UNITY_PASSWORD
# secrets and returned at the end. No Android signing is involved.
#
# Speed notes: the editor and the project Library are cached with explicit
# restore/save steps. actions/cache only saves in its post step on job
# success, which a failing player build would skip, so the saves here run
# with if: always() right after the editor install / project import. A
# sysroot probe runs before the player build so a missing IL2CPP
# sysroot/toolchain fails in minutes instead of after the player data has
# been written.

name: Unity PC build (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/f9c604c3-golub"
    paths:
      - ".github/workflows/unity-pc-build.yml"
      - "Assets/Blitz/EditorTools/SysrootProbeCli.cs"
      - "Tools/unity.sh"
      - "Tools/unity.py"

permissions:
  contents: read
  issues: write

env:
  UNITY_VERSION: "7000.0.0a8"
  UNITY_CHANGESET: "c93e369fcf1c"
  # Deterministic, inspectable location for the extracted IL2CPP
  # sysroot/toolchain payloads; the probe and the build share it.
  UNITY_SYSROOT_CACHE: "${{ github.workspace }}/.sysroot-cache"
  UNITY_SYSROOT_DEBUG: "1"

jobs:
  linux:
    name: Linux production-debug player
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out with LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore the editor cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Unity/Hub/Editor/${{ env.UNITY_VERSION }}
          key: editor-${{ env.UNITY_VERSION }}-${{ env.UNITY_CHANGESET }}

      - name: Restore the Library cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Library
            .sysroot-cache
          key: library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            library-${{ env.UNITY_VERSION }}-

      - name: Install the Unity CLI and the exact editor
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Logs
          # IL2CPP for a Linux target on a Linux host also uses the system
          # Clang toolchain.
          sudo apt-get update -qq && sudo apt-get install -y clang 2>&1 | tee Logs/apt-clang.log
          curl -sL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor -o /usr/share/keyrings/Unity_Technologies_ApS.gpg
          {
            echo "Types: deb"
            echo "URIs: https://hub.unity3d.com/linux/repos/deb"
            echo "Suites: unstable"
            echo "Components: main"
            echo "Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg"
          } | sudo tee /etc/apt/sources.list.d/unity-cli.sources > /dev/null
          sudo apt-get update -qq 2>&1 | tee Logs/unity-cli-install.log
          sudo apt-get install -y unity-cli 2>&1 | tee -a Logs/unity-cli-install.log
          set +e
          unity install "$UNITY_VERSION" -c "$UNITY_CHANGESET" \
            -m linux-il2cpp --cm > Logs/unity-editor-install.log 2>&1
          code=$?
          set -e
          tail -n 40 Logs/unity-editor-install.log || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          EDITOR="$(find "$HOME" -maxdepth 7 -type f -path "*/$UNITY_VERSION/*/Unity" 2>/dev/null | head -1)"
          test -x "$EDITOR"
          echo "UNITY_EDITOR=$EDITOR" >> "$GITHUB_ENV"

      - name: Save the editor cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/Unity/Hub/Editor/${{ env.UNITY_VERSION }}
          key: editor-${{ env.UNITY_VERSION }}-${{ env.UNITY_CHANGESET }}

      - name: Activate the Personal license
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --activate-all --include-personal \
            --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"

      - name: Import the project
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Logs
          cp .env.example .env
          python3 Tools/bootstrap_sentry_sdk.py > Logs/sentry-bootstrap.log 2>&1 || { tail -n 100 Logs/sentry-bootstrap.log; exit 1; }
          UNITY="$UNITY_EDITOR" Tools/unity.sh import > Logs/import.log 2>&1
          code=$?
          tail -n 30 Logs/import.log || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi

      - name: Inspect the sysroot packages
        if: always()
        shell: bash
        run: |
          {
            echo "== PackageCache entries (sysroot/toolchain/sdk) =="
            ls Library/PackageCache 2>/dev/null | grep -i -E "sysroot|toolchain|sdk" || echo "<none>"
            echo "== sysroot cache entries =="
            find "$UNITY_SYSROOT_CACHE" -maxdepth 4 2>/dev/null | head -60 || echo "<none>"
            echo "== sysroot mentions in the import log =="
            grep -i -m 40 "sysroot\|toolchain" Logs/import.log 2>/dev/null || echo "<none>"
            echo "== package errors in the import log =="
            grep -i -m 40 "Failed to resolve\|Cannot connect\|packages.unity.com\|UPM" Logs/import.log 2>/dev/null || echo "<none>"
          } | tee Logs/sysroot-inspection.log

      - name: Save the Library cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            Library
            .sysroot-cache
          key: library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}

      - name: Probe the Linux sysroot (fail fast)
        shell: bash
        run: |
          set -uo pipefail
          UNITY="$UNITY_EDITOR" Tools/unity.sh sysroot-probe > Logs/sysroot-probe.log 2>&1
          code=$?
          grep -E "\[BlitzSysroot\]|error|Error" Logs/sysroot-probe.log | tail -n 80 || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi

      - name: Build the Linux player
        shell: bash
        run: |
          set -uo pipefail
          UNITY="$UNITY_EDITOR" Tools/unity.sh linux-production-debug > Logs/linux-production-debug.log 2>&1
          code=$?
          tail -n 40 Logs/linux-production-debug.log || true
          ls -lh Build/Linux-productiondebug/ 2>/dev/null || true
          if [ "$code" -ne 0 ]; then exit "$code"; fi

      - name: Upload the PC build
        uses: actions/upload-artifact@v4
        with:
          name: BlitzLegacy-linux-productiondebug
          path: Build/Linux-productiondebug
          if-no-files-found: error
          retention-days: 14

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "PC build failed in run $GITHUB_RUN_ID."
            echo
            echo "## editor install result"
            echo '```'
            grep '"type":"result"' Logs/unity-editor-install.log 2>/dev/null || echo "<missing>"
            echo '```'
            for f in Logs/sysroot-probe.log Logs/sysroot-inspection.log Logs/sentry-bootstrap.log Logs/linux-production-debug.log; do
              echo
              echo "## $f (tail)"
              echo '```'
              tail -n 100 "$f" 2>/dev/null | cut -c1-400 || echo "<missing>"
              echo '```'
            done
            echo
            echo "## sysroot/toolchain/error lines from Logs/import.log"
            echo '```'
            grep -i -m 60 "sysroot\|toolchain\|error" Logs/import.log 2>/dev/null | grep -v "ApiUpdater" | cut -c1-400 || echo "<none>"
            echo '```'
          } > /tmp/pc-diagnostics.md
          head -c 60000 /tmp/pc-diagnostics.md > /tmp/pc-diagnostics-short.md
          gh issue create --title "[ci] PC build diagnostics $GITHUB_RUN_ID" \
            --body-file /tmp/pc-diagnostics-short.md || true

      - name: Return the Personal license
        if: always()
        shell: bash
        run: |
          CLIENT="$(dirname "$UNITY_EDITOR")/Data/Resources/Licensing/Client/Unity.Licensing.Client"
          "$CLIENT" --return-ulf || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-pc-logs
          path: Logs
          if-no-files-found: ignore
          retention-days: 7
